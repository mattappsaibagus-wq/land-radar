name: Land Radar agents
on:
  schedule:
    - cron: "0 22 * * *"   # setiap hari 05:00 WIB
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: land-radar, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - name: Jalankan agen
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DASHBOARD_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
        run: python run_all.py
      - name: Simpan hasil
        run: |
          git config user.name "land-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add config data docs
          git diff --cached --quiet || git commit -m "Land Radar: pembaruan $(date -u +%F)"
          git push
